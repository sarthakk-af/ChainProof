<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chainproof-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>ChainProof — Decentralized Placement Tracking</title>
    <meta
      name="description"
      content="ChainProof is an internal placement platform for one college, where each placement figure is signed on a blockchain by the party with nothing to gain from inflating it."
    />
    <meta name="keywords" content="blockchain, placement tracking, campus placement, college, India" />
    <meta name="author" content="ChainProof" />

    <!-- Open Graph -->
    <meta property="og:title" content="ChainProof — Decentralized Placement Tracking" />
    <meta property="og:description" content="A college placement record nobody can fudge — each figure signed on a blockchain by whoever would be embarrassed by the lie." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Fraunces for headings, IBM Plex Sans for UI, IBM Plex Mono for data -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Applied before first paint so switching pages/refreshing never flashes the wrong theme -->
    <script>
      (function () {
        var saved = localStorage.getItem("chainproof_theme");
        if (saved) document.documentElement.dataset.theme = saved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
