# nginx site for ChainProof.
#
# Install (replace YOUR_DOMAIN first — e.g. chainproof.duckdns.org):
#   sudo cp deploy/nginx-chainproof.conf /etc/nginx/sites-available/chainproof
#   sudo sed -i 's/YOUR_DOMAIN/chainproof.duckdns.org/g' /etc/nginx/sites-available/chainproof
#   sudo ln -s /etc/nginx/sites-available/chainproof /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then `sudo certbot --nginx -d YOUR_DOMAIN` adds HTTPS to this file itself.
#
# One domain for both halves: the website at /, and the backend at /api.
# Same origin, so the browser never makes a cross-site request at all.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # The built website. Outside /home on purpose: Ubuntu home folders are
    # private, and nginx reading the build from one fails with a 403.
    root /var/www/chainproof;
    index index.html;

    # A roster upload of 5,000 students is ~750 KB; the backend accepts 1 MB.
    client_max_body_size 1m;

    # The backend. The trailing slashes strip the /api prefix, so
    # /api/auth/login reaches the backend as /auth/login.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's own address, set rather than appended, so a client
        # can't fake one. The backend reads it with TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A blockchain write waits for its block; leave it time to answer.
        proxy_read_timeout 120s;
    }

    # The app picks its page from the URL (/results, /admin, /profile...), so
    # any path that isn't a real file is served the app itself.
    location / {
        try_files $uri /index.html;
    }

    # Built files carry a content hash in their name, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
